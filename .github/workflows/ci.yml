name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORJA_API_TOKEN: ci-placeholder-token-24-chars-min
      FORJA_ALLOW_MOCKS: 'true'
      FORJA_REQUIRE_DOCKER: 'false'
      HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Backend tests
        run: npm test
        working-directory: backend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Frontend build (typecheck + bundle)
        run: npm run build
        working-directory: frontend
